<text x="113.0" y="336.0" font-size="12" fill="#a3a198" text-anchor="middle" font-weight="400">250</text>
<line x1="198.0" x2="198.0" y1="182" y2="318" stroke="#2c2c2a"/>
<text x="198.0" y="336.0" font-size="12" fill="#a3a198" text-anchor="middle" font-weight="400">500</text>
<line x1="283.0" x2="283.0" y1="182" y2="318" stroke="#2c2c2a"/>
<text x="283.0" y="336.0" font-size="12" fill="#a3a198" text-anchor="middle" font-weight="400">750</text>
<line x1="368.0" x2="368.0" y1="182" y2="318" stroke="#2c2c2a"/>
<text x="368.0" y="336.0" font-size="12" fill="#a3a198" text-anchor="middle" font-weight="400">1,000</text>
<rect x="29" y="182" width="338" height="20" fill="#1a1a19"/>
<text x="34.0" y="198.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="500">BareMetal</text>
<path fill="#3987e5" d="M28.0 204H313.8Q317.8 204 317.8 208V224Q317.8 228 313.8 228H28.0Z"/>
<text x="325.8" y="221.0" font-size="15" fill="#f0efec" text-anchor="start" font-weight="600">852</text>
<text x="104.0" y="198.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">1.17 ms per token</text>
<rect x="29" y="250" width="338" height="20" fill="#1a1a19"/>
<text x="34.0" y="266.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="500">PyTorch</text>
<path fill="#d95926" d="M28.0 272H127.0Q131.0 272 131.0 276V292Q131.0 296 127.0 296H28.0Z"/>
<text x="139.0" y="289.0" font-size="15" fill="#f0efec" text-anchor="start" font-weight="600">303</text>
<text x="104.0" y="266.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">3.30 ms per token</text>
<text x="28.0" y="382.0" font-size="24" fill="#f0efec" text-anchor="start" font-weight="600">100 of 100</text>
<text x="28.0" y="402.0" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="400">generated tokens identical</text>
<text x="228.0" y="382.0" font-size="24" fill="#f0efec" text-anchor="start" font-weight="600">0.00005</text>
<text x="228.0" y="402.0" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="400">largest logit difference</text>
<text x="476.0" y="138.0" font-size="16" fill="#f0efec" text-anchor="start" font-weight="600">Matrix multiply kernel</text>
<text x="476.0" y="158.0" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="400">GFLOP/s, log scale. PyTorch's cuBLAS is 8.0× faster at 4,096</text>
