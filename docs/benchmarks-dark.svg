<text x="772.0" y="192.9" font-size="14" fill="#f0efec" text-anchor="start" font-weight="600">39.7K</text>
<text x="772.0" y="208.9" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">PyTorch</text>
<text x="772.0" y="290.8" font-size="14" fill="#f0efec" text-anchor="start" font-weight="600">4.9K</text>
<text x="772.0" y="306.8" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">BareMetal</text>
<line x1="28" x2="872" y1="426" y2="426" stroke="#2c2c2a"/>
<text x="28.0" y="448.0" font-size="12" fill="#a3a198" text-anchor="start" font-weight="400">One small model only. Larger models spend more of each token in matrix multiplies, where PyTorch is faster,</text>
