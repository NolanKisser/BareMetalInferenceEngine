<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" role="img" aria-label="On tinyllama-15M, BareMetal generates 852 tokens per second and PyTorch 303, with identical tokens. On the matrix multiply kernel, PyTorch reaches 39,664 GFLOP/s and BareMetal 4,944 at size 4,096." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect x="0.5" y="0.5" width="899" height="475" rx="8" fill="#1a1a19" stroke="#383835"/>
<text x="28.0" y="46.0" font-size="23" fill="#f0efec" text-anchor="start" font-weight="600">2.8× the token rate of PyTorch on a small Llama model</text>
<text x="28.0" y="70.0" font-size="14" fill="#c3c2b7" text-anchor="start" font-weight="400">tinyllama-15M, greedy generation on one RTX 5080, median of 40 runs per engine</text>
<rect x="28" y="94" width="16" height="4" rx="2" fill="#3987e5"/>
<text x="50.0" y="100.0" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="400">BareMetal</text>
<rect x="130" y="94" width="16" height="4" rx="2" fill="#d95926"/>
<text x="152.0" y="100.0" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="400">PyTorch with Hugging Face transformers</text>
<text x="28.0" y="138.0" font-size="16" fill="#f0efec" text-anchor="start" font-weight="600">Token generation</text>
<text x="28.0" y="158.0" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="400">Tokens per second, 100 tokens, one at a time</text>
